# Cleanuparr — stalled/blocklisted torrent cleanup
# - Config on host at /data/.state/cleanuparr
# - HTTP service on port 11011
cleanuparr:
  enabled: true

  env:
    PUID: "1000"
    PGID: "169"
    TZ: "Europe/Lisbon"
    UMASK: "002"
    PORT: "11011"

  service:
    type: ClusterIP
    port: 11011

  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 100Mi

  podSecurityContext:
    fsGroup: 169
    runAsUser: 1000
    runAsGroup: 169

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

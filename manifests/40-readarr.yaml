# Readarr — DISABLED.
#
# Upstream Readarr is pre-1.0 and unmaintained — the LinuxServer.io
# image has no :latest tag and the last published build
# (nightly-version-0.4.19.2811) is from 2025-06-27. See the README's
# 'Open follow-ups' for the longer discussion.
#
# To re-enable: uncomment the Deployment + Service + readarr
# Ingress below, restore the api_key in secrets (run
# `sops secrets.enc.yaml` and add a `readarr:` block), and
# `kubectl apply -f manifests/40-readarr.yaml`. The
# prowlarr-applications Job's readarr step is already conditional
# (it skips add_app "Readarr" if /config/readarr/config.xml
# doesn't exist), so the wiring auto-recovers when readarr
# comes back.
#
# When re-enabling, the readarr image tag is whatever's
# available — :nightly-version-0.4.19.2811 as of the last write,
# or a newer nightly-version-* tag if upstream has published
# one. Check with:
#   skopeo list-tags docker://lscr.io/linuxserver/readarr | tail

# Sonarr — TV automation
# - Config + DB on host at /data/.state/sonarr
# - Reads/writes /data/media/tv
# - Reads /data/downloads to pick up completed downloads
# - HTTP service on port 8989
sonarr:
  image:
    repository: lscr.io/linuxserver/sonarr
    tag: latest
    pullPolicy: Always
  enabled: true

  env:
    PUID: "1000"
    PGID: "169"
    TZ: "Europe/Lisbon"
    UMASK: "002"

  service:
    type: ClusterIP
    port: 8989

  persistence:
    # Use our pre-created hostPath-backed PVC for /config.
    enabled: true
    existingClaim: servarr-sonarr-config

  podSecurityContext:
    fsGroup: 169

  extraVolumes:
    - name: data
      hostPath:
        path: /data
        type: Directory
    - name: tmp
      emptyDir: {}

  extraVolumeMounts:
    - name: data
      mountPath: /data
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

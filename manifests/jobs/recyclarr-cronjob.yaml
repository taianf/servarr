# Recyclarr CronJob: clones https://github.com/TRaSH-/Guides-Configs
# into the recyclarr-config PVC and runs `recyclarr sync` daily.
# Mirrors the nixflix `nixflix.recyclarr.enable` behavior (TRaSH
# quality profiles + custom formats, plus a 1080p default that
# matches `nixflix.recyclarr.radarrQuality = "1080p"`).
#
# The initial recyclarr.yml + the bootstrap Job that seeds it
# onto the PVC live in recyclarr-bootstrap-config.yaml (separate
# file so `bin/apply-jobs recyclarr-bootstrap-config` works via
# the filename-substring matcher).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: servarr
  labels:
    app.kubernetes.io/component: recyclarr
spec:
  # Daily at 04:00. Hour chosen to avoid the TRaSH guide nightly
  # update window (00:00-03:00 UTC).
  schedule: "0 4 * * *"
  # Don't keep old successful runs around forever.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: servarr-jobs
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 169
          initContainers:
            - name: fetch-trash-guides
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache git >/dev/null
                  if [ ! -d /config/guides/.git ]; then
                    echo "Cloning TRaSH-/Guides-Configs into /config/guides..."
                    git clone --depth 1 https://github.com/TRaSH-/Guides-Configs.git /config/guides
                  else
                    echo "Updating existing TRaSH-/Guides-Configs clone..."
                    git -C /config/guides pull --ff-only
                  fi
              volumeMounts:
                - name: recyclarr-config
                  mountPath: /config
          containers:
            - name: recyclarr
              # The official image. Reads /config/recyclarr.yml.
              image: ghcr.io/recyclarr/recyclarr:7.0.0
              args: ["sync"]
              env:
                - name: HOME
                  value: /config
              volumeMounts:
                - name: recyclarr-config
                  mountPath: /config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: recyclarr-config
              persistentVolumeClaim:
                claimName: recyclarr-config

# Jellyseerr — media request manager
# - Config on host at /data/.state/seerr
# - Stateless w.r.t. /data (only reads via *arr APIs)
# - HTTP service on port 5055
seerr:
  enabled: true

  service:
    type: ClusterIP
    port: 5055

  persistence:
    # Use our pre-created hostPath-backed PVC for /config.
    enabled: true
    existingClaim: servarr-seerr-config

  podSecurityContext:
    fsGroup: 169
    runAsUser: 1000
    runAsGroup: 169

  extraVolumes:
    - name: tmp
      emptyDir: {}

  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Ingress resources for every *arr app.
# All use the k3s Traefik ingress class, route to the in-cluster
# ClusterIP service, and listen on http (no TLS — LAN-only).
# Hostnames are `*.k8s.nixflix` so they sit next to the nixflix
# `*.nixflix` aliases. Reachable at http://<service>.k8s.nixflix:30080
# during the side-by-side phase (Traefik NodePort 30080).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: servarr-prowlarr
  namespace: servarr
  labels:
    app.kubernetes.io/name: servarr-prowlarr
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.k8s.nixflix
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: servarr-prowlarr
                port:
                  number: 9696

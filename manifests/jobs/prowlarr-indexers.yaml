# prowlarr-indexers: declare the indexer list in Prowlarr.
# Idempotent. The list is mirrored from the nixflix NixOS config
# (nixflix/default.nix lines 96-102). Edit this list (and re-run
# `bin/apply-jobs prowlarr-indexers`) when you want to add/remove
# indexers.
#
# Auto-wires Prowlarr's ApiKey from /config/prowlarr/config.xml
# (hostPath mount). No sops dependency.
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-indexers
  namespace: servarr
  labels:
    app.kubernetes.io/component: prowlarr-wiring
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: servarr-jobs
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 169
      initContainers:
        - name: wait-for-prowlarr
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl >/dev/null

              PROWLARR_CFG=/config/prowlarr/config.xml
              [ -f "$PROWLARR_CFG" ] || { echo "Prowlarr config not found at $PROWLARR_CFG"; exit 1; }
              API_KEY=$(grep -oP 'ApiKey>[^<]+' "$PROWLARR_CFG" | head -1 | sed 's/ApiKey>//')
              [ -n "$API_KEY" ] || { echo "Prowlarr config has no ApiKey yet"; exit 1; }

              # Persist for the main container via /tmp.
              mkdir -p /tmp/prowlarr-indexers
              echo "$API_KEY" > /tmp/prowlarr-indexers/api_key

              PROWLARR_URL="http://servarr-prowlarr:9696"
              for i in $(seq 1 60); do
                if curl -sf -H "X-Api-Key: $API_KEY" "$PROWLARR_URL/api/v1/system/status" >/dev/null; then
                  echo "Prowlarr API ready"
                  exit 0
                fi
                [ "$i" -eq 60 ] && { echo "Prowlarr API never came up"; exit 1; }
                sleep 2
              done
          volumeMounts:
            - name: tmp-prowlarr-indexers
              mountPath: /tmp
            - name: prowlarr-config
              mountPath: /config
              readOnly: true
      containers:
        - name: prowlarr-indexers
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl jq >/dev/null

              API_KEY=$(cat /tmp/prowlarr-indexers/api_key)
              PROWLARR_URL="http://servarr-prowlarr:9696"

              # Indexer list (kept in sync with the nixflix NixOS config).
              # Each entry is "Name|DefinitionPath|Protocol|Privacy|Url".
              INDEXERS='
                The Pirate Bay|cardigann|1|1|https://thepiratebay.org
                1337x|cardigann|1|1|https://1337x.to
                TorrentGalaxy|cardigann|1|1|https://torrentgalaxy.to
                YTS|cardigann|2|1|https://yts.mx
                LimeTorrents|cardigann|1|1|https://www.limetorrents.info
              '

              # 1=public torrent, 2=public usenet, 1=public
              sync_indexer() {
                local name="$1" definitionPath="$2" protocol="$3" privacy="$4" url="$5"

                # Build indexer payload using Prowlarr's schema.
                # We POST without specifying implementation; Prowlarr
                # looks up the implementation from the name in the
                # Torznab/Torrent cardigann definitions.
                local payload
                payload=$(jq -n \
                  --arg name "$name" \
                  --argjson protocol "$protocol" \
                  --argjson privacy "$privacy" \
                  --arg baseUrl "$url" \
                  --arg definitionPath "$definitionPath" \
                  '{
                    name: $name,
                    implementation: "Cardigann",
                    implementationName: $name,
                    configContract: "CardigannSettings",
                    enable: true,
                    protocol: $protocol,
                    privacy: $privacy,
                    downloadClientId: 0,
                    priority: 25,
                    baseUrl: $baseUrl,
                    fields: [
                      {name: "definitionFile", value: $definitionPath},
                      {name: "defaultSorting", value: "desc"},
                      {name: "removeYear", value: false},
                      {name: "queryLimit", value: 100},
                      {name: "queryTime", value: 30}
                    ]
                  }')

                # Check if already exists
                local existing_id
                existing_id=$(curl -sf -H "X-Api-Key: $API_KEY" \
                  "$PROWLARR_URL/api/v1/indexer" \
                  | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -n1)

                if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
                  echo "Indexer '$name' already exists (id=$existing_id), updating"
                  curl -sf -X PUT -H "X-Api-Key: $API_KEY" -H "Content-Type: application/json" \
                    -d "$payload" \
                    "$PROWLARR_URL/api/v1/indexer/$existing_id" >/dev/null
                else
                  echo "Creating indexer '$name'"
                  curl -sf -X POST -H "X-Api-Key: $API_KEY" -H "Content-Type: application/json" \
                    -d "$payload" \
                    "$PROWLARR_URL/api/v1/indexer" >/dev/null
                fi
              }

              while IFS='|' read -r name def proto priv url; do
                # Skip blank/comment lines
                [ -z "$name" ] || [ "${name#\#}" != "$name" ] && continue
                sync_indexer "$name" "$def" "$proto" "$priv" "$url"
              done <<EOF
              $INDEXERS
              EOF

              echo "Prowlarr indexers configured"
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp-prowlarr-indexers
              mountPath: /tmp
      volumes:
        - name: tmp-prowlarr-indexers
          emptyDir: {}
        - name: prowlarr-config
          hostPath:
            path: /data/.state/prowlarr
            type: Directory

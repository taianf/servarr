# Static hostPath PVs + PVCs for the chart-managed *arr apps.
# The kubitodev/servarr chart hardcodes the /config volume source
# (PVC or emptyDir depending on persistence.enabled) and ignores
# `extraVolumes`. `persistence.enabled: false` puts /config on
# emptyDir, which loses the SQLite DB + API key on every pod
# restart — and means our sops-secrets API key never matches what
# Prowlarr/Sonarr/etc. is actually serving.
#
# Fix per app: pre-create a hostPath PV backed by /data/.state/<app>
# and an empty PVC that binds to it, then set
#   *.persistence.{config,etc}.existingClaim: <pvc>
# in values/<app>.yaml. The chart sees the existing claim and
# mounts it directly (no dynamic provisioning, no chart-managed
# PVC). The *arr SQLite DBs and API keys now survive restarts, so
# our sops-stored keys stay valid.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: servarr-prowlarr-config-pv
  labels:
    app.kubernetes.io/part-of: servarr
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  hostPath:
    path: /data/.state/prowlarr
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: servarr-prowlarr-config
  namespace: servarr
  labels:
    app.kubernetes.io/part-of: servarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: servarr-prowlarr-config-pv
---

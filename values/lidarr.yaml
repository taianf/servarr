# Lidarr — Music automation
# - Config + DB on host at /data/.state/lidarr
# - Reads/writes /data/media/music
# - HTTP service on port 8686
lidarr:
  enabled: true

  env:
    PUID: "1000"
    PGID: "169"
    TZ: "America/Sao_Paulo"
    UMASK: "002"

  service:
    type: ClusterIP
    port: 8686

  persistence:
    enabled: false

  podSecurityContext:
    fsGroup: 169
    runAsUser: 1000
    runAsGroup: 169

  extraVolumes:
    - name: config
      hostPath:
        path: /data/.state/lidarr
        type: DirectoryOrCreate
    - name: data
      hostPath:
        path: /data
        type: Directory
    - name: tmp
      emptyDir: {}

  extraVolumeMounts:
    - name: config
      mountPath: /config
    - name: data
      mountPath: /data
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 512Mi

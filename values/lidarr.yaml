# Lidarr — Music automation
# - Config + DB on host at /data/.state/lidarr
# - Reads/writes /data/media/music
# - HTTP service on port 8686
lidarr:
  image:
    repository: lscr.io/linuxserver/lidarr
    tag: latest
    pullPolicy: Always
  enabled: true

  env:
    PUID: "1000"
    PGID: "169"
    TZ: "Europe/Lisbon"
    UMASK: "002"

  service:
    type: ClusterIP
    port: 8686

  persistence:
    # Use our pre-created hostPath-backed PVC for /config.
    enabled: true
    existingClaim: servarr-lidarr-config

  podSecurityContext:
    fsGroup: 169

  extraVolumes:
    - name: data
      hostPath:
        path: /data
        type: Directory
    - name: tmp
      emptyDir: {}

  extraVolumeMounts:
    - name: data
      mountPath: /data
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 512Mi

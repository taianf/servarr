# NetworkPolicy: default-allow within the servarr namespace.
#
# History: the previous version had a default-deny + an explicit
# allow-intra-ns policy. The default-deny's podSelector was {}, so
# it applied to every pod, and the explicit allow was supposed to
# carve out intra-namespace + DNS traffic. In practice the deny
# blocked all pod-to-pod traffic — k3s' CNI doesn't apply the
# `except` clause the way the policy expected, so even legitimate
# intra-namespace traffic was refused (the *arr apps couldn't talk
# to each other, and the wiring Jobs hung on `API never came up`).
#
# Single-node LAN, no internet exposure for the pods. Default-allow
# is fine here. If we ever need to lock this down, the cleanest
# path is to switch to a policy-enforcing CNI (Cilium, Calico)
# and re-introduce per-app rules.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servarr-default-allow
  namespace: servarr
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Empty ingress[]/egress[] = allow everything (default-allow).
  ingress: []
  egress: []

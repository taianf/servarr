name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  # Job name `check` matches the branch protection context expected
  # on taianf/dotfiles (so when we enable the same protection on
  # taianf/servarr, the context is already known to GitHub).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: yamllint
        # `.yamllint` is the project config; same rules as the
        # pre-commit yamllint hook so CI catches the same issues.
        run: yamllint --config-file .yamllint .

      - name: prek run --all-files
        # Run prek on all files to catch prettier / markdownlint
        # drift even when the developer forgot to install the
        # hooks locally.
        uses: j178/prek-action@v1
        with:
          args: --all-files --skip ggshield

# Shared *arr UID/GID and hostPath layout.
# All *arr pods run with fsGroup=169 (host's `media` group) and
# runAsGroup=169, runAsUser=1000 (host's taian UID). Files written
# by the pods are therefore owned by 1000:169 — readable/writable
# by the host media tree and by nixflix's services (which use the
# same group). PUID/PGID env vars override the LinuxServer.io
# entrypoint's default UID/GID; the securityContext is belt-and-
# braces and also controls the hostPath mount (fsGroup).
#
# Host path layout (assumed):
#   /data/media/{movies,tv,music,books}   -- the *arr libraries
#   /data/downloads/{complete,incomplete} -- qBittorrent working dir
#   /data/.state/<app>                    -- per-app config + DBs
---
servarr:
  # The host's `media` group GID. Confirmed via `getent group media`.
  mediaGid: "169"
  # The host's primary user UID. The LinuxServer.io entrypoint
  # chowns files to PUID:PGID at startup; matching it to the host
  # user means files are accessible to the user without sudo.
  userUid: "1000"
  # The single hostPath that backs /data. Every *arr pod mounts
  # this at /data so the *arr apps can see the shared library +
  # downloads. *arr apps use sub-paths (/data/media/tv, /data/downloads)
  # so we don't need per-app media hostPaths.
  dataHostPath: /data
  # The base path for per-app state dirs. Each chart release will
  # use <stateBasePath>/<app> as the hostPath source for /config.
  stateBasePath: /data/.state

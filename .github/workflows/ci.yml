name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  # Job name `check` matches the branch protection context expected
  # on taianf/dotfiles (so the same branch protection on main that
  # we set up there works here too).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: prek run --all-files
        # Single source of truth: the hooks listed in
        # .pre-commit-config.yaml. That includes yamllint, prettier,
        # markdownlint, plus the no-commit-to-branch / whitespace /
        # private-key hooks. Mirrors how dotfiles' CI runs one
        # `statix check` step — no duplicated config.
        uses: j178/prek-action@v1
        with:
          args: --all-files --skip ggshield

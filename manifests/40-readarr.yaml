# Readarr — book/audiobook automation
# NOT in the kubitodev/servarr chart, so we ship a plain Deployment
# using the linuxserver/readarr image. Lifecycle matches the
# other *arr apps: /config for state, /data for media.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: servarr
  labels:
    app.kubernetes.io/name: readarr
    app.kubernetes.io/part-of: servarr
spec:
  replicas: 1
  strategy:
    # The PVC-backed /config doesn't support rolling updates cleanly;
    # Recreate avoids two pods writing to the same volume.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: readarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readarr
        app.kubernetes.io/part-of: servarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 169
        fsGroup: 169
      containers:
        - name: readarr
          image: lscr.io/linuxserver/readarr:nightly-version-0.4.19.2811
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "169"
            - name: TZ
              value: Europe/Lisbon
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          hostPath:
            path: /data/.state/readarr
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /data
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: readarr
  namespace: servarr
  labels:
    app.kubernetes.io/name: readarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: readarr
  ports:
    - name: http
      port: 8787
      targetPort: http
      protocol: TCP

# Local sops config for the servarr repo.
# Uses the same age key as the dotfiles repo
# (/etc/ssh/ssh_host_ed25519_key.pub → ssh-to-age) so a single host
# key unlocks both repos. To re-encrypt against a new key:
#   sops updatekeys secrets.enc.yaml
#
# Replace RECIPIENT_BELOW with the actual age1... recipient derived
# from this host's SSH ed25519 key:
#   nix-shell -p ssh-to-age --run 'ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub'
creation_rules:
  - path_regex: secrets\.enc\.yaml$
    key_groups:
      - age:
          - age1fccdw8xgfrl682rupj446z4qqlffq73z4yj498grrr4u39mtwu5q4387w3

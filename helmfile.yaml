# Single release of kubitodev/servarr, with all sub-charts
# (prowlarr, sonarr, radarr, lidarr, qbittorrent, jellyfin,
# jellyseerr, bazarr, flaresolverr, cleanuparr) enabled. The chart
# is a single chart with toggles per sub-chart — it must NOT be
# deployed once-per-app (that creates 10× every pod writing to
# the same /data/.state/<app>, with Service names suffixed by
# release so bare <app> DNS names don't exist). One release
# named 'servarr' gives:
#   * Pods:  prowlarr-servarr-…, sonarr-servarr-…, …
#   * Services:  servarr-prowlarr, servarr-sonarr, …
#   * (except qBittorrent, which has 2 services:
#      servarr-qbittorrent-web  and  servarr-qbittorrent-bt)

repositories:
  - name: kubitodev
    url: https://kubitodev.github.io/helm

# Defaults applied to the release.
helmDefaults:
  args:
    - --timeout=10m
  createNamespace: false

# Single release. The order of `values:` matters: later values
# override earlier ones, so per-app values (hostPath, PUID/PGID,
# etc.) win over the bare `enabled: true` defaults below.
releases:
  - name: servarr
    chart: kubitodev/servarr
    version: 1.5.2
    namespace: servarr
    values:
      - ./values/_common.yaml
      - ./values/prowlarr.yaml
      - ./values/sonarr.yaml
      - ./values/radarr.yaml
      - ./values/lidarr.yaml
      - ./values/qbittorrent.yaml
      - ./values/jellyfin.yaml
      - ./values/jellyseerr.yaml
      - ./values/bazarr.yaml
      - ./values/flaresolverr.yaml
      - ./values/cleanuparr.yaml
